<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>United Trams — Кедровское трамвайное управление</title>
<link rel="icon" href="https://i.postimg.cc/bYb0sKnD/Vector.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#454753;--c2:#9C9EAC;--c3:#38393F;--text:#EEEFF4;--muted:#9C9EAC;--line:rgba(156,158,172,.2);--glass:rgba(69,71,83,.3);--r:26px;
--hero-img:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:"Unbounded",system-ui,sans-serif;background:var(--c3);color:var(--text);line-height:1.55;font-size:14px;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(100px);animation:drift 28s ease-in-out infinite alternate}
.b1{width:48vw;height:48vw;background:var(--c1);left:-12vw;top:30vh;opacity:.6}
.b2{width:36vw;height:36vw;background:var(--c2);right:-10vw;top:60vh;opacity:.18;animation-delay:-10s}
@keyframes drift{to{transform:translate3d(10vw,-8vh,0) scale(1.2)}}
.glass{background:var(--glass);backdrop-filter:blur(17px) saturate(140%);-webkit-backdrop-filter:blur(17px) saturate(140%);border:1px solid var(--line);border-radius:var(--r);position:relative;box-shadow:0 24px 50px -28px #000,inset 0 1px 0 rgba(255,255,255,.06)}
.hov{overflow:hidden}
.hov::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(156,158,172,.2),transparent 60%)}
.hov:hover::after{opacity:1}
/* страницы */
.page{display:none;min-height:100vh;padding-bottom:130px}
.page.on{display:block;animation:pg .6s cubic-bezier(.2,.7,.2,1)}
@keyframes pg{from{opacity:0;transform:translateY(22px);filter:blur(10px)}}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* верх */
.top{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 0;pointer-events:none}
.top>*{pointer-events:auto}
.mark{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.mark img{width:26px;height:26px;object-fit:contain}
.lang{display:flex;padding:4px;border-radius:999px;position:relative}
.lang button{font:600 11px "Unbounded";color:var(--muted);background:none;border:0;padding:9px 16px;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .3s}
.lang button.on{color:var(--c3)}
.lang i{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);background:var(--c2);border-radius:999px;transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.lang.en i{transform:translateX(100%)}
/* hero */
.hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;overflow:hidden;border-radius:0 0 40px 40px}
.hero .pic{position:absolute;inset:0;background:var(--hero-img) center/cover,linear-gradient(#5c5e6b,#2d2e34);filter:grayscale(1);animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08)}}
.hero svg.sc{position:absolute;inset:0;width:100%;height:100%;animation:kb 24s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(56,57,63,.1),rgba(56,57,63,.2) 40%,var(--c3) 100%)}
.hero .wrap{width:100%;max-width:none;margin:0;padding:0 28px}
.hero .in{position:relative;z-index:2;padding:0 0 46px;width:100%;text-align:left}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#d9dae2;padding:9px 16px;border-radius:999px;margin-bottom:22px}
.pill b{width:6px;height:6px;border-radius:50%;background:var(--c2);box-shadow:0 0 0 0 var(--c2);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}}
h1{font-size:clamp(2.4rem,8vw,5.6rem);line-height:.98;font-weight:600;letter-spacing:-.04em}
.hsub{color:#c9cad4;margin:20px 0 24px;max-width:30rem;font-weight:300}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{padding:10px 16px;border-radius:999px;font-size:11px;font-weight:300}
.chip b{font-weight:600;margin-right:5px}
.down{margin-left:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line);color:var(--text);transition:.3s}
.down:hover{transform:translateY(4px)}
.rise>*{opacity:0;transform:translateY(24px);filter:blur(8px);animation:rs .9s cubic-bezier(.2,.7,.2,1) forwards}
.rise>*:nth-child(2){animation-delay:.12s}.rise>*:nth-child(3){animation-delay:.24s}.rise>*:nth-child(4){animation-delay:.36s}
@keyframes rs{to{opacity:1;transform:none;filter:none}}
/* карточки */
.card{padding:26px;margin-top:18px}
.lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
h2{font-size:clamp(1.2rem,3vw,1.7rem);font-weight:600;letter-spacing:-.02em;margin-bottom:12px;line-height:1.2}
.card p{color:#b9bac6;font-weight:300;font-size:13px;max-width:46rem;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{padding:16px 18px;border-radius:18px;background:rgba(56,57,63,.48);border:1px solid var(--line)}
.tile:hover{translate:0 -3px}
.tile b{display:block;font-size:15px;font-weight:600}.tile small{color:var(--muted);font-size:10px;font-weight:300}
.pagehead{padding:110px 0 6px}
.pagehead h1{font-size:clamp(1.8rem,5vw,3.2rem)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* кастомный dropdown */
.dd{position:relative;z-index:5}
.dd.open{z-index:20}
.dd .lab{margin-bottom:8px}
.ddb{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;font:400 13px "Unbounded";color:var(--text);padding:15px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(56,57,63,.65);cursor:pointer;transition:.3s;text-align:left}
.ddb:hover,.dd.open .ddb{border-color:rgba(156,158,172,.55);background:rgba(69,71,83,.8)}
.ddb svg{flex:none;transition:transform .35s}
.dd.open .ddb svg{transform:rotate(180deg)}
.ddm{position:absolute;left:0;right:0;top:calc(100% + 8px);padding:8px;border-radius:20px;background:rgba(56,57,63,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 30px 60px -20px #000;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top;transition:.3s cubic-bezier(.2,.8,.3,1);max-height:300px;overflow:auto}
.dd.open .ddm{opacity:1;visibility:visible;transform:none}
.ddo{display:flex;align-items:center;gap:12px;width:100%;font:300 12px "Unbounded";color:#cfd0da;background:none;border:0;padding:12px 14px;border-radius:13px;cursor:pointer;text-align:left;transition:.2s}
.ddo:hover{background:rgba(156,158,172,.16);color:#fff;padding-left:18px}
.ddo.sel{background:var(--c2);color:var(--c3);font-weight:600}
.ddo b{display:grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--c1);color:var(--text);font-size:12px}
.ddo.sel b{background:var(--c3)}
/* маршрут */
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px}
@keyframes gr{from{transform:scaleY(0)}}
.stops{list-style:none;margin-top:6px}
.stops li{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding-left:38px;font-size:13px;animation:in2 .6s cubic-bezier(.2,.7,.2,1) both}
.stops li::before{content:"";position:absolute;left:8px;top:50%;width:2px;height:100%;background:rgba(156,158,172,.4);transform-origin:top;animation:gr .5s ease both;animation-delay:inherit}
.stops li:last-child::before{display:none}
.stops li::after{content:"";position:absolute;left:3px;top:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--c3);border:2px solid var(--c2);z-index:1}
.stops li.e::after{left:0;top:calc(50% - 9px);width:18px;height:18px;background:var(--c2);border-color:var(--c3);box-shadow:0 0 0 4px rgba(156,158,172,.22)}
.stops em{font-style:normal;color:var(--muted);font-size:10px;margin-left:auto}
.sb{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:500;padding:9px 16px;border-radius:999px;background:rgba(156,158,172,.16);border:1px solid rgba(156,158,172,.4);transition:background .3s,color .3s,translate .3s}
.sb:hover,.sb:focus-visible{background:var(--c2);color:var(--c3);translate:4px 0;outline:none}
.sb svg{transition:translate .3s}.sb:hover svg{translate:4px 0}
.hint{margin-top:14px;font-size:11px!important;color:var(--muted)!important}
.dep{display:flex;justify-content:space-between;padding:14px 18px;border-radius:16px;background:rgba(56,57,63,.6);margin-top:8px;font-size:13px;animation:in2 .5s cubic-bezier(.2,.7,.2,1) both}
.dep:first-child{background:var(--c2);color:var(--c3);font-weight:600}
.clock{font-size:clamp(2.4rem,7vw,3.6rem);font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.fare{font-size:2rem;font-weight:600;margin:6px 0 10px}
.card ul{padding-left:18px;color:#b9bac6;font-weight:300;font-size:13px;display:grid;gap:7px}
.qa{margin-top:10px;border-radius:20px;border:1px solid var(--line);background:rgba(56,57,63,.5);transition:background .4s,border-color .4s}
.qa.open{background:rgba(69,71,83,.7);border-color:rgba(156,158,172,.45)}
.qb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;font:400 13px "Unbounded";color:var(--text);background:none;border:0;padding:18px 20px;cursor:pointer;text-align:left}
.qb i{position:relative;flex:none;width:28px;height:28px;border-radius:50%;background:var(--c1);transition:transform .5s cubic-bezier(.3,1.4,.5,1),background .3s}
.qb i::before,.qb i::after{content:"";position:absolute;left:8px;right:8px;top:13px;height:2px;border-radius:2px;background:var(--text);transition:transform .4s}
.qb i::after{transform:rotate(90deg)}
.qa.open .qb i{transform:rotate(180deg);background:var(--c2)}
.qa.open .qb i::before,.qa.open .qb i::after{background:var(--c3)}
.qa.open .qb i::after{transform:rotate(0)}
.qc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.2,.8,.2,1)}
.qc>div{overflow:hidden;min-height:0}
.qc p{padding:0 20px 20px;margin:0;opacity:0;transform:translateY(-12px);filter:blur(8px);transition:opacity .45s,transform .55s cubic-bezier(.2,.8,.2,1),filter .45s}
.qa.open .qc{grid-template-rows:1fr}
.qa.open .qc p{opacity:1;transform:none;filter:none;transition-delay:.12s}
.back{display:inline-flex;align-items:center;gap:10px;font:500 11px "Unbounded";color:var(--text);padding:11px 18px;border-radius:999px;text-decoration:none;margin-bottom:22px;transition:translate .3s}
.back:hover{translate:-4px 0}
#stN,#pH{font-size:clamp(1.5rem,4.2vw,2.8rem);overflow-wrap:anywhere}
.tram{position:absolute;right:-2%;bottom:110px;width:min(62vw,780px);z-index:1;pointer-events:none;opacity:0;filter:brightness(0) invert(.78);animation:drive 2.4s .3s cubic-bezier(.15,.8,.2,1) forwards,bob 6s 2.8s ease-in-out infinite alternate}
@keyframes drive{from{opacity:0;transform:translateX(35%);filter:brightness(0) invert(.78) blur(10px)}to{opacity:.85;transform:none;filter:brightness(0) invert(.78) blur(0)}}
@keyframes bob{from{opacity:.85;transform:translateY(0)}to{opacity:.85;transform:translateY(-8px)}}
.wm{position:absolute;right:-18px;bottom:-34px;width:190px;opacity:.1;filter:brightness(0) invert(.75);pointer-events:none;transform:rotate(-12deg);transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .6s}
.hov:hover .wm{transform:rotate(-3deg) scale(1.08);opacity:.18}
.pass{margin-top:18px;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.pass img{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 30px 50px -28px #000}
@media(max-width:700px){.tram{width:92vw;bottom:230px;opacity:.4!important;animation:drive 2.4s .3s forwards}}
.car{margin-top:8px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.vw{position:relative;aspect-ratio:16/9;max-height:74vh;width:100%;border-radius:30px;overflow:hidden;border:1px solid var(--line);background:var(--c1);cursor:grab;outline:none;box-shadow:0 40px 70px -40px #000}
.vw:active{cursor:grabbing}
.fr{position:absolute;inset:0;display:none}.fr.on{display:block}
.im{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.vw::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(30,31,36,.8));pointer-events:none;z-index:5}
.prog{position:absolute;left:0;top:0;height:3px;width:0;background:var(--c2);z-index:7}
.prog.run{animation:pg2 var(--ms) linear forwards}
@keyframes pg2{to{width:100%}}
.ui{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:flex-end;justify-content:space-between;padding:22px 24px;gap:14px}
.big{font-size:clamp(2.4rem,8vw,4.6rem);font-weight:600;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums;display:flex;align-items:flex-end;gap:10px}
.big span{display:inline-block;animation:num .7s cubic-bezier(.2,.8,.2,1)}
.big small{font-size:12px;font-weight:300;color:var(--muted);letter-spacing:0;padding-bottom:4px}
@keyframes num{from{opacity:0;transform:translateY(60%);filter:blur(6px)}}
.arr{display:flex;gap:10px}
.ab{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;color:var(--text);background:rgba(69,71,83,.5);border:1px solid var(--line);cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .3s,color .3s,transform .4s cubic-bezier(.3,1.5,.5,1)}
.ab:hover{background:var(--c2);color:var(--c3);transform:translateY(-3px)}
.ab:active{transform:scale(.92)}
.ab[data-d="-1"]:hover svg{animation:nl .5s}.ab[data-d="1"]:hover svg{animation:nr .5s}
@keyframes nl{50%{transform:translateX(-5px)}}@keyframes nr{50%{transform:translateX(5px)}}
.ab:focus-visible,.th button:focus-visible{outline:2px solid var(--c2);outline-offset:3px}
.th{display:flex;gap:10px;margin-top:14px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.th::-webkit-scrollbar{display:none}
.th button{flex:none;width:96px;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:2px solid transparent;opacity:.5;padding:0;background:var(--c1);cursor:pointer;transition:opacity .4s,transform .45s cubic-bezier(.3,1.4,.5,1),border-color .3s}
.th button:hover{opacity:.85}.th button.on{opacity:1;border-color:var(--c2);transform:translateY(-4px)}
.ph{display:grid;place-items:center;background:linear-gradient(var(--g,150deg),#5d5f6d,#2f3036);position:relative;overflow:hidden}
.ph img{position:absolute;width:70%;height:auto;object-fit:contain;opacity:.22;filter:brightness(0) invert(.8)}
.ph span{position:relative;font-size:12px;color:#d4d5de;padding:10px 18px;border-radius:999px;background:rgba(56,57,63,.5);backdrop-filter:blur(10px)}
.th .ph img{width:60%}.th .ph span{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:20px}
.post{display:block;text-decoration:none;color:inherit;padding:0;animation:in2 .7s cubic-bezier(.2,.7,.2,1) var(--d) both;transition:translate .4s cubic-bezier(.2,.8,.2,1)}
.post:hover{translate:0 -6px}
.post .cv{aspect-ratio:16/10;overflow:hidden}.post .cv .im{transition:transform .9s cubic-bezier(.2,.8,.2,1)}.post:hover .cv .im{transform:scale(1.08)}
.post .bd{padding:20px}.post h3{font-size:15px;font-weight:600;margin:4px 0 8px;line-height:1.3}
.post p{font-size:12px;color:#b9bac6;font-weight:300;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);margin-top:30px}
#post .wrap{max-width:1500px}
.ptx{margin-top:20px}.ptx p{font-size:14px;line-height:1.7;max-width:60rem;margin-bottom:14px}
.apill{display:inline-flex;margin-top:24px;font:400 12px "Unbounded";color:var(--muted);padding:13px 20px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:rgba(69,71,83,.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:color .3s,translate .3s,background .3s}
.apill:hover{color:var(--text);translate:0 -3px;background:rgba(69,71,83,.55)}
#admBtn{display:none;cursor:pointer;color:var(--text);border:1px solid var(--line);padding:0}
#admBtn:hover svg{animation:spin 1s}
@keyframes spin{to{transform:rotate(180deg)}}
.ov{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:14px;background:rgba(35,36,41,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ov.on{display:grid;animation:fd .35s both}@keyframes fd{from{opacity:0}}
.pn{width:min(780px,100%);max-height:92vh;overflow:auto;padding:26px;background:rgba(56,57,63,.86);animation:pop .6s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes pop{from{opacity:0;transform:translateY(34px) scale(.94);filter:blur(10px)}}
.ph2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pp{color:#b9bac6;font-weight:300;font-size:12px;margin-top:10px}
.f{display:grid;gap:10px;margin-top:6px}
.pn input,.pn textarea{font:300 13px "Unbounded";color:var(--text);background:rgba(56,57,63,.75);border:1px solid var(--line);border-radius:14px;padding:13px 15px;width:100%;transition:border-color .3s,background .3s;resize:vertical}
.pn input:focus,.pn textarea:focus{outline:none;border-color:rgba(156,158,172,.7);background:rgba(69,71,83,.8)}
.bt{font:500 12px "Unbounded";padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(69,71,83,.6);color:var(--text);cursor:pointer;transition:background .3s,color .3s,transform .3s}
.bt:hover{background:rgba(156,158,172,.35);transform:translateY(-2px)}
.bt.m,.bt.on{background:var(--c2);color:var(--c3);font-weight:600}
.bt:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.tbs,.row2{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.msg{font-size:11px;min-height:16px;color:#e4e5ec}
.li2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:rgba(56,57,63,.55);margin-top:8px;font-size:12px;animation:in2 .4s both}
.rb{padding:16px;border-radius:18px;background:rgba(56,57,63,.5);border:1px solid var(--line);margin-top:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fl{display:grid;gap:5px;font-size:10px;color:var(--muted);margin-top:6px}
.toast{position:fixed;top:78px;left:50%;z-index:120;transform:translate(-50%,-20px);opacity:0;padding:12px 20px;border-radius:999px;font-size:12px;transition:.5s cubic-bezier(.3,1.4,.5,1);pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.dock{--w:47px}.dock a,.dock i{height:46px}}
@keyframes in2{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
.rv{opacity:0;transform:translateY(34px) scale(.98);filter:blur(10px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1),filter .9s,translate .3s,background .4s,border-color .4s}
.rv.in{opacity:1;transform:none;filter:none}
.dd.open .ddo{animation:in2 .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*40ms)}
.tip{position:absolute;bottom:calc(100% + 16px);left:50%;white-space:nowrap;font-size:11px;font-weight:500;padding:10px 16px;border-radius:999px;background:rgba(69,71,83,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);color:var(--text);pointer-events:none;opacity:0;transform:translate(-50%,10px) scale(.8);filter:blur(6px);transition:opacity .3s,transform .45s cubic-bezier(.3,1.5,.5,1),filter .3s}
.tip::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:rgba(69,71,83,.95);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.dock a:hover .tip,.dock a:focus-visible .tip{opacity:1;transform:translate(-50%,0) scale(1);filter:none}

    else if(d.dl){const[ty,id]=d.dl.split(":");if(confirm("Удалить запись?")){await save({[ty]:DATA[ty].filter(x=>x.id!=id)});toast("Удалено");adminView()}}
    else if("ar" in d){collectR();RD.push({n:"",a:"05:30",z:"23:30",v:[1,2.5],s:[]});adminView()}
    else if(d.dr!==undefined){collectR();RD.splice(+d.dr,1);adminView()}
    else if("sr" in d){collectR();const tm=/^\d{1,2}:\d{2}$/;
      if(RD.some(r=>!r.n||r.s.length<2||!tm.test(r.a)||!tm.test(r.z))){toast("У каждого маршрута: номер, время ЧЧ:ММ и минимум 2 остановки");return}
      await save({routes:RD});RD=null;toast("Маршруты сохранены");adminView()}
    else if("ss" in d){const si=[...document.querySelectorAll("[data-k2]")].map(x=>{const g=k=>x.querySelector(`[data-k=${k}]`).value.trim();return{k:x.dataset.k2,p:g("p").split("\n").map(y=>y.trim()).filter(Boolean),d:g("d"),de:g("de")}}).filter(o=>o.p.length||o.d||o.de);
      await save({si});toast("Остановки сохранены");adminView()}
    else if(d.role){const i=d.role.lastIndexOf(":");await API.setRole(d.role.slice(0,i),d.role.slice(i+1));toast("Роль обновлена")}
  }catch(_){}
});
$("ov").onclick=e=>{if(e.target==$("ov"))closeOv()};
addEventListener("keydown",e=>{if(e.key=="Escape")closeOv()});
$("admBtn").onclick=adminView;
document.addEventListener("click",e=>{if(e.target.closest("[data-adm]"))canAdm()?adminView():authView("in")});
/* ================= язык, навигация, эффекты ================= */
function setLang(l){
  L=l;localStorage.setItem("utl",l);document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("lang").classList.toggle("en",l=="en");
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==l));
  renderAll();
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
const P=["home","routes","schedule","news","dev","info"];
function go(){
  let h=location.hash.slice(1);if(h=="about")return;
  if(h.startsWith("stop-")){CS=decodeURIComponent(h.slice(5));h="stop"}
  else if(h.startsWith("post-")){const q=h.split("-");CP={ty:q[1],id:q[2]};h="post"}
  else if(!P.includes(h))h="home";
  const act=h=="stop"?"routes":h=="post"?(CP.ty=="dev"?"dev":"news"):h;
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id==h));
  document.querySelectorAll("#dock a").forEach(a=>a.classList.toggle("on",a.dataset.p==act));
  $("dock").style.setProperty("--i",P.indexOf(act));
  if(h=="stop")drawStop(CS);if(h=="post")drawPost();
  window.scrollTo(0,0);
}
addEventListener("hashchange",go);
$("dn").onclick=e=>{e.preventDefault();$("about").scrollIntoView({behavior:"smooth"})};
document.querySelectorAll(".qb").forEach(b=>b.onclick=()=>{const q=b.parentElement,o=!q.classList.contains("open");q.parentElement.querySelectorAll(".qa.open").forEach(x=>{x.classList.remove("open");x.firstElementChild.setAttribute("aria-expanded","false")});if(o){q.classList.add("open");b.setAttribute("aria-expanded","true")}});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const x=e.target;x.classList.add("in");io.unobserve(x);setTimeout(()=>x.style.transitionDelay="",1600)}}),{threshold:.08});
document.querySelectorAll(".card,.tile,.pagehead,.qa").forEach(e=>{e.classList.add("rv");e.style.transitionDelay=(Array.from(e.parentElement.children).indexOf(e)*90)+"ms";io.observe(e)});
const ps=$("pass");ps.onpointermove=e=>{const b=ps.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;ps.style.transform=`perspective(900px) rotateY(${x*16}deg) rotateX(${-y*16}deg) scale(1.03)`};ps.onpointerleave=()=>ps.style.transform="";
document.addEventListener("pointermove",e=>{document.querySelectorAll(".hov").forEach(g=>{const b=g.getBoundingClientRect();g.style.setProperty("--mx",e.clientX-b.left+"px");g.style.setProperty("--my",e.clientY-b.top+"px")})},{passive:true});
setLang(L);go();initDB();setInterval(()=>{tick();next()},20000);
</script>
